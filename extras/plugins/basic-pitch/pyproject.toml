[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruach-basic-pitch"
version = "0.2.0"
description = "Ruach Studio Refiner plugin: transcribe a take's stems to MIDI with Basic Pitch"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Steven Altsman" }]
requires-python = ">=3.10"
dependencies = ["basic-pitch>=0.4.0"]
classifiers = [
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-bdd>=7", "mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ruach_basic_pitch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
# No python_version pin: mypy checks against the running interpreter, and CI runs
# it on 3.10 through 3.13. (Pinning 3.10 locally breaks when numpy, pulled in by
# pytest's TYPE_CHECKING imports, is installed with 3.12-only stubs.)
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
mypy_path = "src"
files = ["src", "tests", "transcribe.py"]

[[tool.mypy.overrides]]
# Basic Pitch ships no type information; the adapter in transcriber.py is the
# only place it is imported, and annotates what it takes from it.
module = ["basic_pitch", "basic_pitch.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "ANN",      # every function fully annotated
    "D",        # docstrings
    "PT",       # pytest style
]
ignore = [
    "D203", "D213",   # pick one of each conflicting docstring pair (google style)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]        # test names and Gherkin are the documentation
"transcribe.py" = ["E402"]
