    # Ruach Studio's debug logs (HERESY 2054): the Studio's lab posts a ZIP here when its user presses Send in Engine › Debugging.
    # In the site's server block, before its `root` line; ^~ so that regex locations of security includes do not take it.
    # HERESY 2140: the card lives at ruachstudio.art, and this block is in its server block; the old address (ruachstudio.igr.bible)
    # keeps it too, ahead of its 301, since the lab posts with urllib, which turns a 301 into a GET without the body and follows no 308.
    location ^~ /debug/ {
        client_max_body_size    21m;
        proxy_pass              http://127.0.0.1:41990;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        Host $host;
        proxy_read_timeout      60s;
        proxy_request_buffering on;
    }
