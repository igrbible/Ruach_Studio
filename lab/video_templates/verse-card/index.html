<!doctype html>
<!-- HERESY 2396: the Videographer's verse card as a HyperFrames composition (Apache-2.0, HeyGen): HTML and CSS, seeked frame by frame in headless
     Chrome, written with its alpha (ProRes 4444) to lay over the clip. Its words, its address, its font and its length come as variables -->
<html data-composition-variables='[
  {"id":"verse","type":"string","label":"The verse","default":"Свет во тьме светит, и тьма не объяла его."},
  {"id":"address","type":"string","label":"Its address","default":"Иоанна 1:5"},
  {"id":"font","type":"string","label":"The font","default":""}
]'>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "CardFont"; src: url("font.ttf"); }
  html, body { margin: 0; background: transparent; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  .card { position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); max-width: 1320px; padding: 34px 56px 30px; border-radius: 18px;
    background: rgba(8, 8, 10, .62); box-shadow: 0 18px 60px rgba(0, 0, 0, .45); color: #fff; text-align: center;
    font-family: "CardFont", "DejaVu Sans", sans-serif; opacity: 0;
    animation: rise .9s cubic-bezier(.2, .7, .2, 1) .3s forwards, sink .7s ease-in 5.0s forwards; }
  .rule { width: 0; height: 3px; margin: 0 auto 22px; background: #e8b923; border-radius: 2px; animation: draw 1.1s ease-out .6s forwards; }
  .verse { font-size: 50px; line-height: 1.32; font-weight: 600; letter-spacing: .005em; text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
  .address { margin-top: 18px; font-size: 30px; letter-spacing: .14em; text-transform: uppercase; color: #e8b923; opacity: 0; animation: fade .8s ease-out 1.1s forwards; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 40px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes sink { from { opacity: 1; } to { opacity: 0; transform: translate(-50%, 14px); } }
  @keyframes draw { to { width: 180px; } }
  @keyframes fade { to { opacity: 1; } }
</style>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-fps="24">
    <div class="clip" data-start="0" data-duration="6" style="position:absolute;inset:0">
      <div class="card"><div class="rule"></div><div class="verse" id="verse"></div><div class="address" id="address"></div></div>
    </div>
  </div>
  <script>
    const v = window.__hyperframes ? window.__hyperframes.getVariables() : {};
    document.getElementById("verse").textContent = v.verse ? "«" + v.verse + "»" : "";
    document.getElementById("address").textContent = v.address || "";
  </script>
</body>
</html>
