              Remove-Item $now -ErrorAction SilentlyContinue
              & $mt -nologo "-inputresource:$x;#1" "-out:$now" 2>&1 | Out-Null
              if (-not (Test-Path $now) -or (Get-Content $now -Raw) -notmatch 'activeCodePage[^>]*>\s*UTF-8') { $bad += "engine\$k\$n.exe carries no activeCodePage UTF-8" }
              foreach ($d in (& $dumpbin /nologo /dependents $x | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^[\w.-]+\.dll$' })) {
                if (-not (Test-Path "$R\engine\$k\$d") -and $d -ine "nvcuda.dll" -and $d -notmatch '^(api|ext)-ms-' -and -not (Test-Path (Join-Path $env:SystemRoot "System32\$d"))) { $bad += "engine\$k\$n.exe needs $d" }
              }
              if ($k -eq "cpu") {
                $out = & $x --help 2>&1 | Out-String; $code = $LASTEXITCODE
                "engine\$k\$n.exe --help: exit $code"
