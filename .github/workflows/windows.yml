          }
          $swept = 0; $got = ""
          if ($ok) {
            python "$K\tools\lab-sweep.py" http://127.0.0.1:41870 --out lab-sweep-cyrillic.txt; $swept = $LASTEXITCODE
            $u = "http://127.0.0.1:41870/inspect?name=" + [uri]::EscapeDataString($song) + "&force=1"
            foreach ($i in 1..60) {
              try { $got = (Invoke-WebRequest $u -UseBasicParsing -TimeoutSec 20).Content } catch { $got = "$_" }
              if ($got -match '"lufs"' -or $got -match '"failed"') { break }
              $u = "http://127.0.0.1:41870/inspect?name=" + [uri]::EscapeDataString($song)
              Start-Sleep 2
            }
            "inspect: " + $got.Substring(0, [Math]::Min(300, $got.Length))
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          "---- the lab's log (last 30 lines)"
          Get-Content lab-cy-err.txt -Tail 30
          if (-not $ok) { throw "the lab in $K did not answer without PYTHONUTF8" }
          if ($swept) { throw "the lab's GET routes in $K without PYTHONUTF8: tools/lab-sweep.py says which failed (above)" }
          if ($got -notmatch '"lufs"') { throw "the inspect job did not run on the take $take" }
          if (Select-String -Path lab-cy-out.txt, lab-cy-err.txt -Pattern "UnicodeEncodeError|UnicodeDecodeError" -Quiet) { throw "a Unicode error in the lab's log (above)" }

  soak-windows:
    # HERESY 3013 (Viktor's law of 21.11.2026: «прежде чем пушить полный тег с релизом… погоняй… виндозную сборку и собери все логи»; 25.11.2026:
    # the VM cannot take the package over his mobile link): the soak on GitHub's own Windows, every log kept. The package unpacked where a
    # Windows person's folder lies (C:\Users\runneradmin\Ruach Studio Тест\Тестер Иванов), installed by its own launcher\install.ps1 (the CPU
    # packages: no card answers here) and marked as RuachStudio.exe marks a whole install, then started by RuachStudio.exe (console, no page):
    # every GET route of the lab (tools/lab-sweep.py: no 500, no raw WinError), one short song on the processor through /api/v1, then the
    # light parts one at a time through Engine → Models' own route, each tried and the files it brought deleted again, within the runner's
    # disk: the transcriber and a 30 s cover, the stems and a 30 s split, Whisper on 30 s, the NAM amps and one render, the upscale on 10 s.
    # A part that cannot come (its download, the disk) is a warning and stops nothing; an error fails the job: a 500 or a raw WinError, a job
    # that failed with its part here, a Unicode error in a log. The package itself is made and checked above, whatever this job finds
    name: Package · windows-x64 · soaked (install, routes, a song, the light parts)
    needs: [package-windows, check-windows]
    if: ${{ !cancelled() && needs.package-windows.result == 'success' && inputs.soak != 'false' }}
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package-windows.outputs.file }}
          path: pkg
          skip-decompress: true
      - name: Unpacked into a folder with spaces and Cyrillic, installed by its own install.ps1, marked as RuachStudio.exe marks it
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          # the letters from their code points: the runner writes this script in its own encoding
          $test = -join ([char[]](0x0422, 0x0435, 0x0441, 0x0442))
          $who = -join ([char[]](0x0422, 0x0435, 0x0441, 0x0442, 0x0435, 0x0440, 0x0020, 0x0418, 0x0432, 0x0430, 0x043D, 0x043E, 0x0432))
          $Parent = Join-Path $env:USERPROFILE "Ruach Studio $test\$who"
          $Logs = Join-Path $env:RUNNER_TEMP "soak-logs"
          New-Item -ItemType Directory -Force $Parent, $Logs | Out-Null
          $zip = Get-ChildItem pkg -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "the package did not come down" }
          "{0}: {1:N0} MB; {2:N1} GB free on C:" -f $zip.Name, ($zip.Length / 1MB), ((Get-PSDrive C).Free / 1GB)
          Expand-Archive $zip.FullName -DestinationPath $Parent
          $Root = Join-Path $Parent "RuachStudio"
          if (-not (Test-Path -LiteralPath (Join-Path $Root "RuachStudio.exe"))) { throw "no RuachStudio.exe in $Root" }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "RUACH_SOAK=$Root"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "RUACH_SOAK_LOGS=$Logs"
          $env:RUACH_SOAK = $Root; $env:RUACH_SOAK_LOGS = $Logs   # GITHUB_ENV reaches the next steps, not this one
          # the helpers every step below reads (dot-sourced): the answer of a route, the Studio up, a song through /api/v1, a lab job polled
          @'
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $Root = $env:RUACH_SOAK
          $Logs = $env:RUACH_SOAK_LOGS
          $Lab = "http://127.0.0.1:41870"
          $Eng = "http://127.0.0.1:7777"
          $Py = Join-Path $Root ".venv\Scripts\python.exe"
          $RawWords = '\[WinError -?\d+\]|\[Errno -?\d+\]|Traceback \(most recent call last\)'
          function FreeGB { [math]::Round((Get-PSDrive C).Free / 1GB, 1) }
          function SizeGB([string]$Folder) {
            $s = (Get-ChildItem -LiteralPath $Folder -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum
            [math]::Round([double]$s / 1GB, 2)
          }
          function Ask([string]$Url, [string]$Method = "GET", $Json = $null, [int]$Secs = 120) {
            # a 4xx or a 5xx is an answer too (its code and its words); no answer at all is code -1
            $a = @{ Uri = $Url; Method = $Method; UseBasicParsing = $true; TimeoutSec = $Secs; SkipHttpErrorCheck = $true }
            if ($null -ne $Json) {
              $a.Body = [Text.Encoding]::UTF8.GetBytes(($Json | ConvertTo-Json -Depth 8 -Compress))
              $a.ContentType = "application/json; charset=utf-8"
            }
            try { $w = Invoke-WebRequest @a; return [pscustomobject]@{ Code = [int]$w.StatusCode; Text = [string]$w.Content } }
            catch { return [pscustomobject]@{ Code = -1; Text = [string]$_.Exception.Message } }
          }
          function Answers([string]$Url) { return ((Ask $Url -Secs 5).Code -eq 200) }
          function StudioUp([string]$Tag) {
            # RuachStudio.exe keeps the lab and the engine as two services; started again when an earlier step's process did not outlive it
            if ((Answers "$Lab/health") -and (Answers "$Eng/health")) { return }
            Write-Host "RuachStudio.exe --console --no-open ($Tag)"
            $exe = Start-Process -FilePath (Join-Path $Root "RuachStudio.exe") -ArgumentList "--console", "--no-open" -WorkingDirectory $Root -PassThru -NoNewWindow -RedirectStandardOutput "$Logs\launcher-out-$Tag.txt" -RedirectStandardError "$Logs\launcher-err-$Tag.txt"
            $t0 = Get-Date
            while (((Get-Date) - $t0).TotalMinutes -lt 20) {
              Start-Sleep 5
              if ((Answers "$Lab/health") -and (Answers "$Eng/health")) { Write-Host ("the lab and the engine answer after {0:N0} s" -f ((Get-Date) - $t0).TotalSeconds); return }
              if ($exe.HasExited) { break }
            }
            Get-Content "$Logs\launcher-out-$Tag.txt", "$Logs\launcher-err-$Tag.txt" -ErrorAction SilentlyContinue | Write-Host
            Get-Content -LiteralPath (Join-Path $Root "logs\launcher.log") -Tail 40 -ErrorAction SilentlyContinue | Write-Host
            throw "RuachStudio.exe did not bring the lab and the engine up ($Tag)"
          }
          function Song($Body, [string]$Tag, [int]$Minutes) {
            $Body | ConvertTo-Json -Depth 8 | Out-File -Encoding utf8 "$Logs\song-$Tag-asked.json"
            $r = Ask "$Eng/api/v1/songs" "POST" $Body
            if ($r.Code -lt 200 -or $r.Code -ge 300) { throw "POST /api/v1/songs ($Tag): $($r.Code) $($r.Text)" }
            $id = ($r.Text | ConvertFrom-Json).job
            $t0 = Get-Date; $job = $null; $last = ""; $a = $null
            do {
              Start-Sleep 10
              $a = Ask "$Eng/api/v1/jobs/$id"
              if ($a.Code -eq 200) {
                $job = $a.Text | ConvertFrom-Json
                $line = "{0}  {1}" -f $job.status, $job.stage
                if ($line -ne $last) { Write-Host ("{0,6:N0} s  {1}" -f ((Get-Date) - $t0).TotalSeconds, $line); $last = $line }
              }
            } while ((-not $job -or $job.status -notin "done", "failed", "error", "cancelled") -and ((Get-Date) - $t0).TotalMinutes -lt $Minutes)
            if ($a) { $a.Text | Out-File -Encoding utf8 "$Logs\song-$Tag.json" }
            if (-not $job -or $job.status -ne "done") { throw "the song ($Tag) did not end done within $Minutes min: $($a.Text)" }
            Write-Host ("song ({0}): done after {1:N1} min, {2}" -f $Tag, ((Get-Date) - $t0).TotalMinutes, ($job.takes -join ", "))
            return $job
          }
          function Poll202([string]$First, [string]$Then, [string]$Tag, [int]$Minutes) {
            # a lab route that answers 202 while its job runs, then 200 with its result or 500 with its failure
            $t0 = Get-Date; $a = Ask $First
            while ($a.Code -eq 202 -and ((Get-Date) - $t0).TotalMinutes -lt $Minutes) { Start-Sleep 10; $a = Ask $Then }
            $a.Text | Out-File -Encoding utf8 "$Logs\$Tag.json"
            Write-Host ("{0}: {1} after {2:N0} s" -f $Tag, $a.Code, ((Get-Date) - $t0).TotalSeconds)
            return $a
          }
          function LabJob([string]$Prefix, [int]$Minutes) {
            # a lab job by its key in /health (the upscale answers 202 at once and runs on)
            $t0 = Get-Date; $state = ""
            while (((Get-Date) - $t0).TotalMinutes -lt $Minutes) {
              Start-Sleep 10
              $h = Ask "$Lab/health"
              if ($h.Code -ne 200) { continue }
              $hit = ($h.Text | ConvertFrom-Json).jobs.PSObject.Properties | Where-Object { $_.Name -like "$Prefix*" } | Select-Object -First 1
              if ($hit) { $state = [string]$hit.Value }
              if ($state -in "done", "failed", "error", "cancelled") { break }
            }
            Write-Host ("{0}: {1} after {2:N0} s" -f $Prefix, $state, ((Get-Date) - $t0).TotalSeconds)
            return $state
          }
          function ModelFiles {
            $set = [System.Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            foreach ($d in "models", "hf_cache") {
              Get-ChildItem -LiteralPath (Join-Path $Root $d) -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object { [void]$set.Add($_.FullName) }
            }
            return , $set
          }
          '@ | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP "soak.ps1")
          $t0 = Get-Date
          # as RuachStudio.exe runs it at the first start (powershell -ExecutionPolicy Bypass), here with its output kept
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $Root "launcher\install.ps1") -Yes 2>&1 | Tee-Object -FilePath "$Logs\install.txt"
          $code = $LASTEXITCODE
          "install.ps1: exit {0} after {1:N0} min; {2:N1} GB free on C:" -f $code, ((Get-Date) - $t0).TotalMinutes, ((Get-PSDrive C).Free / 1GB)
          if ($code) { throw "the Studio's install stopped (exit $code): install.txt among the logs says why" }
          # RuachStudio.exe's own mark of an install that ended whole, for this version (native.go, InstallDone), as it writes it after install.ps1
          $ver = (Get-Content -LiteralPath (Join-Path $Root "VERSION") -Raw).Trim()
          [IO.File]::WriteAllText((Join-Path $Root ".venv\ruach-install-done"), "$ver`n" + (Get-Date).ToString("o") + "`n", [Text.UTF8Encoding]::new($false))
          Remove-Item -Recurse -Force -LiteralPath (Join-Path $Root "tmp\uv-cache") -ErrorAction SilentlyContinue   # the packages' download cache: the parts need the room
          . (Join-Path $env:RUNNER_TEMP "soak.ps1")
          "models {0} GB, .venv {1} GB, {2} GB free on C:" -f (SizeGB (Join-Path $Root "models")), (SizeGB (Join-Path $Root ".venv")), (FreeGB)
          $global:LASTEXITCODE = 0
      - name: RuachStudio.exe brings the lab and the engine up; every GET route of the lab (no 500, no raw WinError)
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP "soak.ps1")
          StudioUp "start"
          & $Py (Join-Path $Root "tools\lab-sweep.py") $Lab --out "$Logs\lab-sweep.txt"
          $swept = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($swept) { throw "the lab's GET routes: tools/lab-sweep.py says which failed (above)" }
      - name: One short song on the processor through /api/v1
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP "soak.ps1")
          StudioUp "song"
          $job = Song @{ title = "CI soak"; style = "folk ballad, warm male voice, acoustic guitar, 80 bpm"; mode = "direct"; duration = 30; workspace = "CI soak";
                         lyrics = "[Verse]`nSnow is falling on the field`nQuiet breathing of the land`n`n[Chorus]`nWind of heaven, living breath`nSing with me, sing with me" } "song" 100
          $take = [string]@($job.takes)[0]
          if (-not $take) { throw "the song ended done with no take: $($job | ConvertTo-Json -Depth 6 -Compress)" }
          $dir = Join-Path $Root "outputs\$take"
          $audio = Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -match '^audio\.(wav|flac|mp3)$' } | Select-Object -First 1
          if (-not $audio) { throw "the take $take has no audio in $dir" }
          "the take: $take, $($audio.Name) {0:N0} KB" -f ($audio.Length / 1KB)
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "RUACH_SOAK_TAKE=$take"
          # a take of 10 s cut from it, for the upscale
          $short = Join-Path $Root "outputs\ci-soak-10s"
          New-Item -ItemType Directory -Force $short | Out-Null
          Copy-Item -LiteralPath (Join-Path $dir "request.json") -Destination (Join-Path $short "request.json")
          & (Join-Path $Root "runtime\ffmpeg\ffmpeg.exe") -v error -y -i $audio.FullName -t 10 -c:a pcm_s24le (Join-Path $short "audio.wav")
          if ($LASTEXITCODE) { throw "ffmpeg did not cut the 10 s take" }
      - name: The light parts one at a time, each fetched by Engine → Models' route, tried, and its files deleted again
        shell: pwsh
        run: |
          . (Join-Path $env:RUNNER_TEMP "soak.ps1")
          StudioUp "parts"
          $take = $env:RUACH_SOAK_TAKE
          $dir = Join-Path $Root "outputs\$take"
          $audio = (Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -match '^audio\.(wav|flac|mp3)$' } | Select-Object -First 1).FullName
          $style = "folk ballad, warm male voice, acoustic guitar, 80 bpm"
          $bad = @(); $warned = @()
          # each part: its size from lab/weights.py's PARTS (GB), what tries it
          foreach ($part in @(@("transcriber", 3.0), @("stems", 1.0), @("whisper", 3.1), @("nam", 0.01), @("upscale", 0.4))) {
            $name, $need = $part
            "==== $name ({0} GB free on C:)" -f (FreeGB)
            if ((FreeGB) -lt (2 * $need + 3)) { $warned += "$name skipped: $(FreeGB) GB free on C:, it needs about $need GB"; "::warning::$($warned[-1])"; continue }
            $before = ModelFiles
            $f = Ask "$Lab/weights/fetch" "POST" @{ part = $name }
            $fetch = ""; $words = ""
            if ($f.Code -ne 202) { $fetch = "failed"; $words = "POST /weights/fetch: $($f.Code) $($f.Text)" }
            else {
              $t0 = Get-Date
              do {
                Start-Sleep 5
                $w = Ask "$Lab/weights"
                $j = if ($w.Code -eq 200) { ($w.Text | ConvertFrom-Json).job } else { $null }
                $fetch = if ($j) { [string]$j.status } else { "" }
              } while ($fetch -notin "done", "failed" -and ((Get-Date) - $t0).TotalMinutes -lt 45)
              if ($j) { $words = ($j.lines | Select-Object -Last 60) -join "`n" }
              "fetch: $fetch after {0:N0} s" -f ((Get-Date) - $t0).TotalSeconds
            }
            $words | Out-File -Encoding utf8 "$Logs\fetch-$name.txt"
            $why = ""
            if ($fetch -ne "done") {
              if ($words -match $RawWords) { $bad += "$name's fetch failed with a raw error (fetch-$name.txt)"; "::error::$($bad[-1])" }
              else { $warned += "$name did not come ($fetch): fetch-$name.txt says why; not tried"; "::warning::$($warned[-1])" }
            }
            else { try {
              switch ($name) {
                "transcriber" {
                  # the cover's way: the recording transcribed into a score, then a 30 s song sung from that score
                  $r = Invoke-WebRequest -Uri "$Eng/transcribe" -Method Post -Form @{ audio = Get-Item -LiteralPath $audio; transcriber = "sheetsage2"; modes = "1" } -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 300
                  $tid = ($r.Content | ConvertFrom-Json).id
                  if (-not $tid) { $why = "POST /transcribe: $($r.StatusCode) $($r.Content)"; break }
                  $t0 = Get-Date
                  do { Start-Sleep 10; $s = Ask "$Eng/job?id=$tid" } while ($s.Text -notmatch '"status"\s*:\s*"(done|failed|error|cancelled)"' -and ((Get-Date) - $t0).TotalMinutes -lt 40)
                  $res = Ask "$Eng/job?id=$tid&result=1"
                  $res.Text | Out-File -Encoding utf8 "$Logs\transcribe.json"
                  $abc = if ($res.Code -eq 200) { ($res.Text | ConvertFrom-Json).abc } else { "" }
                  if (-not $abc) { $why = "the transcriber wrote no score: $($s.Text)"; break }
                  "the score: {0} characters" -f $abc.Length
                  $null = Song @{ title = "CI soak cover"; style = $style; abc = $abc; duration = 30; workspace = "CI soak";
                                  lyrics = "[Verse]`nSnow is falling on the field`nQuiet breathing of the land" } "cover" 100
                }
                "stems" {
                  $a = Poll202 "$Lab/stems?name=$([uri]::EscapeDataString($take))&mode=four" "$Lab/stems?name=$([uri]::EscapeDataString($take))&mode=four" "stems" 40
                  $made = @(Get-ChildItem -LiteralPath (Join-Path $dir "derived\stems-four") -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in ".flac", ".wav" })
                  if ($a.Code -ne 200 -or $made.Count -lt 4) { $why = "the split: $($a.Code), $($made.Count) stems: $($a.Text)" }
                  else { "stems: " + (($made | ForEach-Object { $_.Name }) -join ", ") }
                }
                "whisper" {
                  $q = [uri]::EscapeDataString($take)
                  $a = Poll202 "$Lab/gloss?name=$q&force=1" "$Lab/gloss?name=$q" "whisper" 40
                  if ($a.Code -ne 200) { $why = "Whisper against the lyrics: $($a.Code) $($a.Text)" }
                }
                "nam" {
                  $set = Join-Path $dir "derived\stems-four"
                  if (-not (Test-Path -LiteralPath $set)) {
                    $set = Join-Path $env:RUNNER_TEMP "nam-set"; New-Item -ItemType Directory -Force $set | Out-Null
                    & (Join-Path $Root "runtime\ffmpeg\ffmpeg.exe") -v error -y -i $audio -c:a flac (Join-Path $set "other.flac")
                  }
                  $out = Join-Path $env:RUNNER_TEMP "nam-out"; New-Item -ItemType Directory -Force $out | Out-Null
                  $params = Join-Path $env:RUNNER_TEMP "nam-params.json"; [IO.File]::WriteAllText($params, "{}", [Text.UTF8Encoding]::new($false))
                  & $Py (Join-Path $Root "lab\builtin_steps\ruach\nam.py") $set $out $params 2>&1 | Tee-Object -FilePath "$Logs\nam.txt"
                  $rc = $LASTEXITCODE; $global:LASTEXITCODE = 0
                  if ($rc -or -not (Test-Path -LiteralPath (Join-Path $out "nam.flac"))) { $why = "the Amp (NAM) step: exit $rc (nam.txt)" }
                }
                "upscale" {
                  $u = Ask "$Lab/upscale?name=ci-soak-10s&mode=subtle&variants=1"
                  $u.Text | Out-File -Encoding utf8 "$Logs\upscale-asked.json"
                  $uid = if ($u.Code -eq 202) { ($u.Text | ConvertFrom-Json).id } else { "" }
                  if (-not $uid) { $why = "GET /upscale: $($u.Code) $($u.Text)"; break }
                  $state = LabJob "upscale:ci-soak-10s:$uid" 40
                  if ($state -ne "done") { $why = "the upscale of 10 s: $state" }
                }
              }
            } catch { $why = "$name's try threw: $($_.Exception.Message)" }
            if ($why) { $bad += $why; "::error::$why" } else { "$($name): tried, it works" } }
            # the files this part brought (or a fetch cut short left), deleted again: the next part has the room
            $after = ModelFiles
            $gone = 0.0
            foreach ($p in $after) { if (-not $before.Contains($p)) { $gone += (Get-Item -LiteralPath $p -Force).Length; Remove-Item -LiteralPath $p -Force -ErrorAction SilentlyContinue } }
            "{0}: {1:N2} GB it brought deleted; {2} GB free on C:" -f $name, ($gone / 1GB), (FreeGB)
          }
          $global:LASTEXITCODE = 0
          # HERESY 2998: no Unicode error in the Studio's own logs, from a folder with spaces and Cyrillic
          $uni = Select-String -Path (Join-Path $Root "logs\*.log") -Pattern "UnicodeEncodeError|UnicodeDecodeError" -ErrorAction SilentlyContinue
          if ($uni) { $bad += "a Unicode error in the Studio's logs: $(($uni | Select-Object -First 3 | ForEach-Object { $_.Line.Trim() }) -join ' | ')" }
          $raw = Select-String -Path (Join-Path $Root "logs\*.log") -Pattern '\[WinError -?\d+\]' -ErrorAction SilentlyContinue
          foreach ($x in ($raw | Select-Object -First 10)) { "::warning::$($x.Filename): $($x.Line.Trim())" }
          "warned: $($warned.Count), errors: $($bad.Count)"
          if ($bad) { throw ($bad -join "; ") }
      - name: The tester's report and every log
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (-not $env:RUACH_SOAK -or -not (Test-Path (Join-Path $env:RUNNER_TEMP "soak.ps1"))) { "no Studio unpacked: nothing to collect"; exit 0 }
          . (Join-Path $env:RUNNER_TEMP "soak.ps1")
          $ErrorActionPreference = "Continue"
          $rep = Join-Path $Logs "report"
          $p = Start-Process -FilePath (Join-Path $Root "RuachStudio.exe") -ArgumentList "--report", "--report-dir", $rep -PassThru -NoNewWindow -RedirectStandardOutput "$Logs\report-out.txt" -RedirectStandardError "$Logs\report-err.txt"
          if ($p.WaitForExit(180000)) { "the tester's report: exit $($p.ExitCode)" } else { "the tester's report did not end in 3 min"; Stop-Process -Id $p.Id -Force }
          Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($Root, [StringComparison]::OrdinalIgnoreCase) } | ForEach-Object { "stopping $($_.ProcessName) ($($_.Id))"; Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep 3
          Copy-Item -Recurse -Force -LiteralPath (Join-Path $Root "logs") -Destination (Join-Path $Logs "studio-logs") -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath (Join-Path $Root "models") -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { "{0,14:N0}  {1}" -f $_.Length, $_.FullName.Substring($Root.Length + 1) } | Out-File -Encoding utf8 "$Logs\models.txt"
          "{0} GB free on C:" -f (FreeGB) | Out-File -Encoding utf8 "$Logs\disk.txt"
          Get-ChildItem -LiteralPath $Logs -Recurse -File | ForEach-Object { "{0,10:N0}  {1}" -f $_.Length, $_.FullName.Substring($Logs.Length + 1) }
          exit 0
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ruach-soak-windows-logs
          path: ${{ runner.temp }}/soak-logs
          if-no-files-found: warn
          retention-days: 30

  package-macos:
    # HERESY 2687: one zip for a Mac with Apple Silicon: the tree as git holds it, without the engine's sources, the visiting card and the
    # Windows files at its top; the page built above; the Metal engine in engine/ (one file each, ggml inside). zip keeps the files' modes and
    # Archive Utility gives them back, so RuachStudio.command and the engine stay executable
    name: Package · macos-arm64 · one zip
    needs: [macos, page]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    outputs:
      file: ${{ steps.pack.outputs.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: ruach-page
          path: page
      - uses: actions/download-artifact@v8
        with:
          name: ruach-engine-macos-arm64-metal
          path: engines
      - name: Assemble
        id: pack
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=7 HEAD)
          ver=$(tr -d '[:space:]' < VERSION)
          ref="$GITHUB_REF_NAME"            # the tag (v2.0.9) or the branch the run was started on
          when=$(date -u +%Y-%m-%d)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          src="built in this run, for macOS 13.3 and later"
          file="RuachStudio-$ver-macos-arm64-$sha.zip"
          S=stage/RuachStudio
          mkdir -p "$S"
          git archive --format=tar HEAD | tar -x -C "$S"
          rm -rf "$S/build" "$S/site" "$S/.github" "$S/RuachStudio.cmd" "$S/INSTALL_WINDOWS.md" "$S/launcher/win"
          git archive --format=tar HEAD build/tools/console/pwa | tar -x -C "$S"
          mkdir -p "$S/build/tools/public" "$S/engine"
          cp page/index.html page/manifest.webmanifest "$S/build/tools/public/"
          unzip -q "$(find engines -name ruach-engine-macos-arm64-metal.zip | head -1)" -d "$S/engine"
          test -f "$S/engine/yue-server" || { echo "no engine/yue-server"; exit 1; }
          find "$S/engine" -type f -exec chmod 755 {} +
          chmod 755 "$S/RuachStudio.command"
          cat > note.md <<'EOF'
          > [!NOTE]
          > **A beta package of Ruach Studio @VER@ for macOS on Apple Silicon (M1 and later)**, made by GitHub's builder from `@REF@` (commit @SHA@, @DATE@). Double-click **RuachStudio.command**: the first start brings the Studio's own Python and the models a song needs into this folder (the backbone sized by the Mac's memory); every start runs the lab in the background and the engine (Metal) in that window, and opens the Studio in the browser. Nothing here is signed: the first time macOS refuses it, open System Settings, Privacy & Security, and press Open Anyway (or, in Terminal, `xattr -dr com.apple.quarantine` on this folder).

          EOF
          { sed -e "s/@SHA@/$sha/" -e "s/@DATE@/$when/" -e "s|@REF@|$ref|" -e "s/@VER@/$ver/" note.md; awk 'skip && /^>/ {next} skip && /^$/ {skip=0; next} {skip=0; print}' skip=1 README.md; } > "$S/README.md"
          printf 'Ruach Studio %s, the macOS package for Apple Silicon (beta)\ncommit   %s (%s)\nbuilt    %s by %s\nengine   %s\n         engine/: Metal, ggml linked in, arm64\n' \
            "$ver" "$(git rev-parse HEAD)" "$ref" "$when" "$run" "$src" > "$S/BUILD.txt"
          (cd stage && zip -q -r "../$file" RuachStudio)
          ls -la "$file"; unzip -l "$file" | tail -1; unzip -Z "$file" RuachStudio/RuachStudio.command "RuachStudio/engine/*"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.file }}
          archive: false
          retention-days: 30

  check-macos:
    # HERESY 2687: the zip as a Mac person gets it, opened as Archive Utility opens it (ditto): every Mach-O in it arm64 alone, for macOS 13.3
    # and later, linked to macOS' own libraries alone, signed ad hoc (Apple Silicon runs nothing unsigned) and executable; RuachStudio.command executable and
    # sound to bash 3.2; the engine starts; start.py picks engine/yue-server; the lab from the package starts on macOS and answers
    name: Package · macos-arm64 · unpacked and looked through
    needs: package-macos
    if: ${{ !cancelled() && needs.package-macos.result == 'success' }}
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package-macos.outputs.file }}
          path: pkg
          skip-decompress: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every binary arm64, linked to macOS alone, signed ad hoc; the engine starts; start.py picks it
        run: |
          set -euo pipefail
          zip=$(find pkg -name "*.zip" | head -1)
          test -n "$zip" || { echo "the package did not come down"; exit 1; }
          ls -la "$zip"
          ditto -x -k "$zip" unpacked
          R=unpacked/RuachStudio
          test -x "$R/RuachStudio.command" || { echo "RuachStudio.command is not executable"; exit 1; }
          /bin/bash -n "$R/RuachStudio.command"
          n=0
          while IFS= read -r f; do
            n=$((n + 1))
            archs=$(lipo -archs "$f")
            minos=$(otool -l "$f" | awk '/LC_BUILD_VERSION/ {b = 1} b && $1 == "minos" {print $2; exit}')
            libs=$(otool -L "$f" | tail -n +2 | awk '{print $1}')
            bad=$(printf '%s\n' "$libs" | grep -vE '^(/usr/lib/|/System/Library/)' || true)
            sig=$(codesign -dv "$f" 2>&1 | grep -E '^Signature=' || true)
            echo "${f#"$R"/}: $archs · macOS $minos and later · $(printf '%s\n' "$libs" | grep -c .) libraries: $(printf '%s ' $libs) · ${sig:-no signature}"
            [ "$archs" = arm64 ] || { echo "  not arm64 alone"; exit 1; }
            [ "${minos%%.*}" -le 13 ] || { echo "  asks for macOS $minos: a Mac on 13 or 14 would refuse it"; exit 1; }
            [ -z "$bad" ] || { echo "  links outside macOS: $bad"; exit 1; }
            codesign -v "$f" || { echo "  its signature does not hold"; exit 1; }
            [ -x "$f" ] || { echo "  not executable"; exit 1; }
          done < <(find "$R" -type f -print0 | xargs -0 file | grep "Mach-O" | cut -d: -f1)
          [ "$n" -ge 3 ] || { echo "only $n Mach-O files in the package"; exit 1; }
          set +e; out=$("$R/engine/yue-server" --help 2>&1); code=$?; set -e
          printf '%s\n' "$out" | head -3; echo "engine/yue-server --help: exit $code"
          [ "$code" -le 1 ] && [ -n "$out" ] || { echo "the engine did not start"; exit 1; }
          python3 -I -c "import sys; sys.path.insert(0, sys.argv[1]); import start; e = start.engine_bin(False); print('start.py picks:', e); assert e.parent.name == 'engine' and e.is_file()" "$R/launcher"
          cat "$R/BUILD.txt"
      - name: The lab from the package starts on macOS and answers /health
        run: |
          python3 -m pip install -q numpy soundfile psutil
          cd unpacked/RuachStudio
          PYTHONUTF8=1 python3 lab/lab.py > "$RUNNER_TEMP/lab-out.txt" 2> "$RUNNER_TEMP/lab-err.txt" &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -fs -m 5 -o "$RUNNER_TEMP/health.json" http://127.0.0.1:41870/health; then ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
          done
          swept=0                                          # HERESY 2937: every GET route of the packaged lab once
          [ "$ok" = 1 ] && { python3 tools/lab-sweep.py http://127.0.0.1:41870 --out "$RUNNER_TEMP/lab-sweep.txt" || swept=1; }
          kill "$pid" 2>/dev/null || true
          echo "---- the lab's log (last 30 lines)"; tail -30 "$RUNNER_TEMP/lab-err.txt"
          [ "$ok" = 1 ] || { echo "the packaged lab did not answer on macOS"; exit 1; }
          [ "$swept" = 0 ] || { echo "the packaged lab's GET routes: tools/lab-sweep.py says which failed (above)"; exit 1; }
          echo "health: $(head -c 300 "$RUNNER_TEMP/health.json")"
