# The Studio's engine for Windows, native (no WSL): yue-server.exe and its tools under MSVC, CPU and CUDA.
# HERESY 2649 (Viktor 16.11.2026: «Поставь в приоритет сборку Студии как нативное приложение Windows… добей этот Викноуз порт»).
# The recipe follows timoncool/yue2.cpp's release workflow (MIT): Jimver's CUDA toolkit on windows-latest. No card is needed to build;
# windows-2022 on purpose: windows-latest carries Visual Studio 2026, which CUDA 12.8 does not install into, and CUDA 13 drops Pascal (sm_61).
# the CUDA kernels are compiled for Pascal (sm_61) to Blackwell (sm_120), PTX for what comes after; linked whole, as on Linux (no backend DLLs). Nothing here is signed (his word, 08.11).
# HERESY 2685, 2687 (Viktor 16.11.2026: «Пообещал ему к концу недели нативное приложение»): the engines go on into two packages, one zip each for a
# person to unpack and double-click: Windows (the CUDA engine, the CPU one beside it, the page, the lab, RuachStudio.cmd) and macOS on Apple Silicon
# (the Metal engine, the page, the lab, RuachStudio.command). Each package is unpacked again on its own system and tried before anyone gets it.
# A run by hand may take the Windows engines of an earlier run (engines_from, within their 14 days) and make the packages in minutes, not in
# two hours; the Mac engine is built every time (two minutes).
# A release (2.0.9, Viktor 18.11.2026 «готовь 2.0.9 и релизай вместе с AppImage и бета сборками»): run by hand on the
# release tag, gh workflow run windows.yml --repo igrbible/Ruach_Studio --ref vX.Y.Z; the packages then name the tag and the version (VERSION),
# not the workshop branch. A push to main or a tag runs nothing here: the nightly main pushes and their beta tags must not start a two-hour build.
name: Windows engine

on:
  workflow_dispatch:
    inputs:
      engines_from:
        description: "Package the Windows engines of this earlier run (its id) instead of building them; empty builds them here (the Mac engine is built anyway)"
        required: false
        default: ""
      soak:
        description: "HERESY 3013: soak the package on GitHub's Windows (install, every GET route, a song on the processor, the light parts one at a time); false leaves it out"
        required: false
        default: "true"
  push:
    branches: [win-native]
    paths: ["build/**", "lab/**", "launcher/**", "tools/**", "RuachStudio.cmd", "RuachStudio.command", ".github/workflows/windows.yml"]

# no shared concurrency: a push for the lab must not cancel the CUDA build an hour into its kernels

permissions:
  contents: read
  actions: read          # the Windows engines of an earlier run (engines_from)

jobs:
  cpu:
    name: Engine · windows-x64 · CPU
    if: ${{ !inputs.engines_from }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build (CPU)
        shell: pwsh
        run: |
          cmake -S build -B build-cpu -G "Visual Studio 17 2022" -A x64 -DGGML_CUDA=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          cmake --build build-cpu --config Release -j $env:NUMBER_OF_PROCESSORS --target yue-server yue-synth yue-plan quantize neural-codec mp3-codec -- /v:minimal
      - name: Smoke test
        shell: pwsh
        run: |
          Get-ChildItem build-cpu\bin\Release, build-cpu\Release -Filter *.exe -ErrorAction SilentlyContinue | Select-Object Name, Length
          $exe = Get-ChildItem build-cpu -Recurse -Filter yue-server.exe | Select-Object -First 1
          if (-not $exe) { throw "no yue-server.exe" }
          & $exe.FullName --help 2>&1 | Select-Object -First 15   # its usage, exit 1: it ran
          $global:LASTEXITCODE = 0
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Get-ChildItem build-cpu -Recurse -Include *.exe, *.dll | Where-Object { $_.FullName -match '\\Release\\' } | Copy-Item -Destination dist
          # HERESY 2649 (found on a clean Windows 11 in VirtualBox, 16.11.2026: STATUS_DLL_NOT_FOUND): the MSVC runtime and its OpenMP beside the
          # exe, app-local as Microsoft lets them be redistributed; a fresh Windows has neither vcruntime140, msvcp140 nor vcomp140
          $vs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $vs) { throw "no Visual C++ redistributable folder on the runner" }
          Copy-Item (Join-Path $vs.FullName "Microsoft.VC143.CRT\*.dll") dist
          Copy-Item (Join-Path $vs.FullName "Microsoft.VC143.OpenMP\*.dll") dist
          Get-ChildItem dist -Filter *.dll | Select-Object Name, Length | Format-Table -AutoSize | Out-String
          Compress-Archive -Path dist\* -DestinationPath ruach-engine-windows-x64-cpu.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ruach-engine-windows-x64-cpu
          path: ruach-engine-windows-x64-cpu.zip
          retention-days: 14

  cuda:
    name: Engine · windows-x64 · CUDA 12.8
    if: ${{ !inputs.engines_from }}
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: "12.8.1"
          method: local          # the whole toolkit: a network install with picked sub-packages failed (exit 3772776473) on windows-2022
      - name: Configure and build (CUDA)
        shell: pwsh
        run: |
          cmake -S build -B build-cuda -G "Visual Studio 17 2022" -A x64 -T cuda="$env:CUDA_PATH" -DGGML_CUDA=ON -DGGML_CUDA_FA=ON -DGGML_NATIVE=OFF `
            -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON "-DCMAKE_CUDA_ARCHITECTURES=61-real;70-real;75-real;80-real;86-real;89-real;120"
          cmake --build build-cuda --config Release -j $env:NUMBER_OF_PROCESSORS --target yue-server yue-synth quantize -- /v:minimal
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Get-ChildItem build-cuda -Recurse -Filter yue-server.exe | Select-Object -First 1
          if (-not $exe) { throw "no yue-server.exe" }
          Get-ChildItem $exe.DirectoryName -Include *.exe, *.dll -Recurse | Select-Object Name, Length
          & $exe.FullName --help 2>&1 | Select-Object -First 15   # its usage, exit 1: it ran (no card: the CUDA backend is not touched before)
          $global:LASTEXITCODE = 0
      - name: Package (the CUDA runtime DLLs beside)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Get-ChildItem build-cuda -Recurse -Include *.exe, *.dll | Where-Object { $_.FullName -match '\\Release\\' } | Copy-Item -Destination dist
          # HERESY 2649 (found on a clean Windows 11 in VirtualBox, 16.11.2026: STATUS_DLL_NOT_FOUND): the MSVC runtime and its OpenMP beside the
          # exe, app-local as Microsoft lets them be redistributed; a fresh Windows has neither vcruntime140, msvcp140 nor vcomp140
          $vs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $vs) { throw "no Visual C++ redistributable folder on the runner" }
          Copy-Item (Join-Path $vs.FullName "Microsoft.VC143.CRT\*.dll") dist
          Copy-Item (Join-Path $vs.FullName "Microsoft.VC143.OpenMP\*.dll") dist
          Get-ChildItem dist -Filter *.dll | Select-Object Name, Length | Format-Table -AutoSize | Out-String
          foreach ($n in "cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll") { Copy-Item (Join-Path $env:CUDA_PATH "bin\$n") dist -ErrorAction SilentlyContinue }
          Compress-Archive -Path dist\* -DestinationPath ruach-engine-windows-x64-cuda12.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ruach-engine-windows-x64-cuda12
          path: ruach-engine-windows-x64-cuda12.zip
          retention-days: 14

  lab:
    name: Lab · windows-x64 · starts and answers
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every lab file compiles
        run: python -m compileall -q lab
      - name: What the lab imports at its start (numpy and soundfile; the jobs bring their own with the installer)
        run: python -m pip install -q numpy soundfile psutil
      - name: The lab starts on Windows and answers /health (its own standard library only)
        shell: pwsh
        run: |
          $env:PYTHONUTF8 = "1"
          $p = Start-Process python -ArgumentList "lab/lab.py" -PassThru -NoNewWindow -RedirectStandardOutput lab-out.txt -RedirectStandardError lab-err.txt
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { $r = Invoke-WebRequest http://127.0.0.1:41870/health -UseBasicParsing -TimeoutSec 5; "health: " + $r.Content.Substring(0, [Math]::Min(400, $r.Content.Length)); $ok = $true; break } catch { if ($p.HasExited) { break } }
          }
          # HERESY 2924 (GitHub issue 15): the system bar and the Weights panel answer on Windows (no os.statvfs, os.uname nor /proc there)
          $bad = @()
          if ($ok) {
            try { Invoke-WebRequest "http://127.0.0.1:41870/sys/live?since=0" -UseBasicParsing -TimeoutSec 30 | Out-Null } catch { }
            Start-Sleep 3                                  # the first ask starts the sampler; its drives and numbers are there on the next
            foreach ($u in "/sys/live?since=0", "/weights") {
              try {
                $j = (Invoke-WebRequest ("http://127.0.0.1:41870" + $u) -UseBasicParsing -TimeoutSec 30).Content | ConvertFrom-Json
                if ($u -eq "/weights" -and $j.free -isnot [long] -and $j.free -isnot [int]) { $bad += "$u gave no free space: $($j.free)" }
                if ($u -ne "/weights" -and (-not $j.cpu.cpu -or $j.disks.Count -lt 1 -or $j.error)) { $bad += "$u gave no processor or no drive, or an error: $($j.error)" }
                $t = $j | ConvertTo-Json -Depth 3 -Compress; "$u answers: " + $t.Substring(0, [Math]::Min(300, $t.Length))
              } catch { $bad += "$u failed: $($_.Exception.Message)" }
            }
          }
          # HERESY 2937 (the 2.1.0-rc1 Windows soak found by hand what CI never asked): every GET route of the lab once, read from its own
          # handler: no 500 of the Studio's own (a package this runner lacks is the runner's), no [WinError], no traceback
          if ($ok) {
            python tools/lab-sweep.py http://127.0.0.1:41870 --out lab-sweep.txt
            if ($LASTEXITCODE) { $bad += "the lab's GET routes: tools/lab-sweep.py says which failed (above)" }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          "---- the lab's log (last 60 lines)"
          Get-Content lab-err.txt -Tail 60
          if (-not $ok) { throw "the lab did not answer on Windows" }
          if ($bad.Count) { throw ($bad -join "; ") }
      - name: The standard-library tests
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PYTHONUTF8 = "1"
          foreach ($t in "test_places.py", "test_paths.py", "test_utf8_law_2998.py") { "== $t"; python lab/$t 2>&1 | Select-Object -Last 15 }

  macos:
    # 16.11.2026 (a tester on an Apple M1): the engine on Apple Silicon with Metal, after timoncool/yue2.cpp's macOS job (MIT)
    name: Engine · macos-arm64 · Metal
    runs-on: macos-15                    # macos-14 retired by GitHub ("macos-14-arm64 is not supported", 17.11.2026)
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build (Metal)
        run: |
          # HERESY 2687 (18.11.2026): without a deployment target the runner's SDK set the floor at macOS 15.0, and a Mac on 13 or 14 would refuse
          # the engine; 13.3 as llama.cpp's own releases (std::to_chars for floats needs it)
          cmake -S build -B build-mac -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON
          cmake --build build-mac --config Release -j "$(sysctl -n hw.ncpu)" --target yue-server yue-synth quantize
      - name: Smoke test
        run: |
          exe=$(find build-mac -name yue-server -type f -perm -u+x | head -1)
          test -n "$exe" || { echo "no yue-server"; exit 1; }
          "$exe" --help 2>&1 | head -8 || true
          otool -L "$exe" | head -12
          # 17.11.2026: one file on the tester's Mac, no @rpath into the runner's build folder
          if otool -L "$exe" | grep -q "libggml"; then echo "yue-server still links ggml's dylibs"; exit 1; fi
      - name: Package
        run: |
          mkdir -p dist && find build-mac -type f -perm -u+x \( -name yue-server -o -name yue-synth -o -name quantize \) -exec cp {} dist/ \;
          find build-mac -name "*.dylib" -exec cp {} dist/ \; 2>/dev/null || true
          (cd dist && zip -q -r ../ruach-engine-macos-arm64-metal.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: ruach-engine-macos-arm64-metal
          path: ruach-engine-macos-arm64-metal.zip
          retention-days: 14

  page:
    # HERESY 2685: the page as build.sh makes it (bash and Python's standard library), once for both packages. Empty stand-ins for the engine
    # and for MuScriptor, newer than their sources, keep build.sh to the page alone; so does the absence of ggml's patches here: in a clone where
    # ggml has no git of its own, git apply --check passes on a patch it skips, build.sh says «put on» and asks for the server (18.11.2026)
    name: The page · build.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: |
          set -euo pipefail
          mkdir -p build/build build/build-muscriptor
          for b in build/build/yue-server build/build-muscriptor/ruach-muscriptor; do : > "$b"; chmod +x "$b"; done
          rm -rf build/ggml-patches
          NO_COLOR=1 bash build.sh --no-restart
          ls -la build/tools/public
          test -s build/tools/public/index.html && test -s build/tools/public/manifest.webmanifest
      - uses: actions/upload-artifact@v7
        with:
          name: ruach-page
          path: |
            build/tools/public/index.html
            build/tools/public/manifest.webmanifest
          retention-days: 14

  natives:
    # HERESY 2992 (Viktor 25.11.2026: «По всем моделям и по не ASCII путям с пробелами всё зафикси в Windows порте»): the native programs the
    # Windows rooms lacked, built here with MSVC as the engine is, for the processor (AVX2) and for CUDA 12.8, and packed beside the engine
    # (engine\cpu, engine\cuda): llama.cpp's llama-server (the Writer, the Bank Builder's Listener) and llama-mtmd-cli (the style listener's
    # GGUFs) at the commit the Linux Studio runs, static (no ggml or llama DLL beside the engine's), without OpenSSL (it is handed local files)
    # and for llama.cpp's own set of cards (Pascal and Volta by PTX); audio.cpp's audiocpp_server (the Narrator's Drama 3) from build/audio.cpp
    # at its pin by its own scripts/build_windows.ps1, fish_drama3 alone as tools/narrator-setup.sh builds it on Linux, its model specs built in
    # (the package has no build/), for the same cards; ruach-muscriptor (sound to MIDI) from build/muscriptor, the processor's only, as on
    # Linux. Nothing upstream is patched. Every .exe carries build/tools/utf8.manifest's activeCodePage UTF-8 (HERESY 2649): audio.cpp and
    # ruach-muscriptor link it in, llama.cpp's two get it merged by mt.exe, and each is checked here and again in the package. A leg that
    # fails is said in the run; the package is made without it, and its room says so on Windows.
    name: Natives · windows-x64 · ${{ matrix.what }} · ${{ matrix.kind }}
    if: ${{ !inputs.engines_from }}
    runs-on: windows-2022
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { what: llama, kind: cpu }
          - { what: llama, kind: cuda12 }
          - { what: narrator, kind: cpu }
          - { what: narrator, kind: cuda12 }
          - { what: muscriptor, kind: cpu }
    env:
      LLAMA_COMMIT: fb4b2737a808a3fb7c2117a498f43815dc9be53e   # vendor/llama.cpp where the Writer and the Listener run on Linux (02.10.2026)
      AUDIOCPP_ARCHS: "61-virtual;70-virtual;75-virtual;80-virtual;86-real;89-real;120a-real"   # ggml's own set for CUDA 12.8, as llama.cpp's build takes it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        if: ${{ matrix.what == 'llama' }}
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_COMMIT }}
          path: llama.cpp
      - name: CUDA toolkit
        if: ${{ matrix.kind == 'cuda12' }}
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: "12.8.1"
          method: local
      - name: llama-server and llama-mtmd-cli (llama.cpp)
        if: ${{ matrix.what == 'llama' }}
        shell: pwsh
        run: |
          $gpu = if ("${{ matrix.kind }}" -eq "cuda12") { @("-T", "cuda=$env:CUDA_PATH", "-DGGML_CUDA=ON") } else { @("-DGGML_CUDA=OFF") }
          cmake -S llama.cpp -B llama.cpp/build -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=OFF -DLLAMA_OPENSSL=OFF -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON @gpu
          if ($LASTEXITCODE) { throw "llama.cpp did not configure" }
          cmake --build llama.cpp/build --config Release -j $env:NUMBER_OF_PROCESSORS --target llama-server llama-mtmd-cli -- /v:minimal
          if ($LASTEXITCODE) { throw "llama.cpp did not build" }
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($n in "llama-server.exe", "llama-mtmd-cli.exe") {
            $f = Get-ChildItem llama.cpp/build -Recurse -Filter $n | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
            if (-not $f) { throw "no $n" }
            Copy-Item $f.FullName dist
          }
      - name: audiocpp_server (audio.cpp at its pin, by its own script)
        if: ${{ matrix.what == 'narrator' }}
        shell: pwsh
        run: |
          $k = if ("${{ matrix.kind }}" -eq "cuda12") { "cuda" } else { "cpu" }
          $a = @{ Preset = "windows-$k-release"; Target = "audiocpp_server"; ModelSet = "custom"; Models = "fish_drama3"; CpuArch = "avx2"; DeploymentBuild = $true; Version = "408935b" }
          if ($k -eq "cuda") { $a.CudaArchitectures = $env:AUDIOCPP_ARCHS }
          & ./build/audio.cpp/scripts/build_windows.ps1 @a
          $f = Get-ChildItem "build/audio.cpp/build/windows-$k-release" -Recurse -Filter audiocpp_server.exe | Select-Object -First 1
          if (-not $f) { throw "no audiocpp_server.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $f.FullName dist
          Get-ChildItem $f.DirectoryName -Filter *.dll | Copy-Item -Destination dist
      - name: ruach-muscriptor (build/muscriptor, the processor's)
        if: ${{ matrix.what == 'muscriptor' }}
        shell: pwsh
        run: |
          # RUACH_MSC_NATIVE=OFF: muscriptor.cpp's own portable x86 set, not the runner's processor (build.sh builds for the machine it runs on)
          cmake -S build/muscriptor -B build-msc -G "Visual Studio 17 2022" -A x64 -DRUACH_MSC_NATIVE=OFF
          if ($LASTEXITCODE) { throw "build/muscriptor did not configure" }
          cmake --build build-msc --config Release -j $env:NUMBER_OF_PROCESSORS --target ruach-muscriptor -- /v:minimal
          if ($LASTEXITCODE) { throw "ruach-muscriptor did not build" }
          $f = Get-ChildItem build-msc -Recurse -Filter ruach-muscriptor.exe | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $f) { throw "no ruach-muscriptor.exe" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $f.FullName dist
      - name: UTF-8 in every .exe, the CUDA DLLs each loads beside it, the processor's started
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $mt = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $dumpbin -or -not $mt) { throw "no dumpbin.exe or mt.exe on the runner" }
          $man = (Resolve-Path build\tools\utf8.manifest).Path
          $now = Join-Path $env:RUNNER_TEMP "now.manifest"
          function Test-Utf8($x) {
            Remove-Item $now -ErrorAction SilentlyContinue
            & $mt -nologo "-inputresource:$x;#1" "-out:$now" 2>&1 | Out-Null
            (Test-Path $now) -and ((Get-Content $now -Raw) -match 'activeCodePage[^>]*>\s*UTF-8')
          }
          foreach ($e in Get-ChildItem dist -Filter *.exe) {
            $x = $e.FullName
            if (-not (Test-Utf8 $x)) {
              & $mt -nologo "-inputresource:$x;#1" -manifest $man "-outputresource:$x;#1"   # merged into the manifest MSVC linked in
              if ($LASTEXITCODE) { & $mt -nologo -manifest $man "-outputresource:$x;#1" }      # it had none
            }
            if (-not (Test-Utf8 $x)) { throw "$($e.Name) carries no activeCodePage UTF-8" }
            "$($e.Name): activeCodePage UTF-8"
            if ("${{ matrix.kind }}" -eq "cuda12") {
              # the toolkit's DLLs it loads (audio.cpp's cuFFT), all but the three engine\cuda brings already
              foreach ($d in (& $dumpbin /nologo /dependents $x | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^[\w.-]+\.dll$' })) {
                $c = Join-Path $env:CUDA_PATH "bin\$d"
                if ((Test-Path $c) -and $d -notin "cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll") { Copy-Item $c dist -Force; "  + $d" }
              }
            } else {
              $out = & $x --help 2>&1 | Out-String
              $code = $LASTEXITCODE
              "  --help: exit $code"
              if ($code -eq -1073741515 -or $code -eq -1073741701 -or -not $out.Trim()) { throw "$($e.Name) did not start (exit $code)" }
            }
          }
          $global:LASTEXITCODE = 0
          Get-ChildItem dist | Select-Object Name, Length | Format-Table -AutoSize | Out-String
          Compress-Archive -Path dist\* -DestinationPath "ruach-engine-windows-x64-${{ matrix.what }}-${{ matrix.kind }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ruach-engine-windows-x64-${{ matrix.what }}-${{ matrix.kind }}
          path: ruach-engine-windows-x64-${{ matrix.what }}-${{ matrix.kind }}.zip
          retention-days: 14

  package-windows:
    # HERESY 2685: one zip for Windows. The tree as git holds it, without the engine's sources and the visiting card; the page
    # built above; engine\cuda (CUDA 12.8) and engine\cpu (AVX2) side by side, launcher\start.py picking by nvidia-smi (HERESY 2686). Its one
    # folder is called RuachStudio, short on purpose: Windows' 260-character paths reach into .venv's deepest files
    name: Package · windows-x64 · one zip
    needs: [cpu, cuda, page, natives]
    # HERESY 2992: a natives leg that failed does not stop the package (its room then says so on Windows); the engines and the page do
    if: ${{ !cancelled() && needs.cpu.result != 'failure' && needs.cuda.result != 'failure' && needs.page.result != 'failure' }}
    runs-on: ubuntu-24.04
    outputs:
      file: ${{ steps.pack.outputs.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/win/go.mod
          cache-dependency-path: launcher/win/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: ruach-page
          path: page
      - uses: actions/download-artifact@v8
        if: ${{ !inputs.engines_from }}
        with:
          pattern: ruach-engine-windows-x64-*
          path: engines
      - uses: actions/download-artifact@v8
        if: ${{ inputs.engines_from }}
        with:
          pattern: ruach-engine-windows-x64-*
          path: engines
          run-id: ${{ inputs.engines_from }}
          github-token: ${{ github.token }}
      - name: Assemble
        id: pack
        env:
          ENGINES_FROM: ${{ inputs.engines_from }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=7 HEAD)
          ver=$(tr -d '[:space:]' < VERSION)
          ref="$GITHUB_REF_NAME"            # the tag (v2.0.9) or the branch the run was started on
          when=$(date -u +%Y-%m-%d)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          src="built in this run"; [ -z "$ENGINES_FROM" ] || src="from run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$ENGINES_FROM"
          file="RuachStudio-$ver-windows-x64-$sha.zip"
          S=stage/RuachStudio
          mkdir -p "$S"
          git archive --format=tar HEAD | tar -x -C "$S"
          rm -rf "$S/build" "$S/site" "$S/.github" "$S/RuachStudio.command"
          git archive --format=tar HEAD build/tools/console/pwa | tar -x -C "$S"
          mkdir -p "$S/build/tools/public" "$S/engine/cuda" "$S/engine/cpu"
          cp page/index.html page/manifest.webmanifest "$S/build/tools/public/"
          unzip -q "$(find engines -name ruach-engine-windows-x64-cuda12.zip | head -1)" -d "$S/engine/cuda"
          unzip -q "$(find engines -name ruach-engine-windows-x64-cpu.zip | head -1)" -d "$S/engine/cpu"
          for k in cuda cpu; do test -f "$S/engine/$k/yue-server.exe" || { echo "no engine/$k/yue-server.exe"; exit 1; }; done
          # HERESY 2992: the natives job's programs beside the engine, each zip into engine\cpu or engine\cuda, never over a file the engine
          # brought (unzip -n: the same MSVC and CUDA runtime); a leg that did not build is warned here and named in BUILD.txt, and its room says so
          nat=""
          for n in llama-cpu:cpu llama-cuda12:cuda narrator-cpu:cpu narrator-cuda12:cuda muscriptor-cpu:cpu; do
            z=$(find engines -name "ruach-engine-windows-x64-${n%%:*}.zip" | head -1)
            if [ -n "$z" ]; then unzip -q -n "$z" -d "$S/engine/${n##*:}"; nat="$nat ${n%%:*}"
            else echo "::warning::no ${n%%:*} natives in this package (that leg did not build): its room says so on Windows"; fi
          done
          # HERESY 2989 (Viktor 25.11.2026: «В Windows сборку включи самый стабильный ffmpeg.exe, чтобы не иметь лишней зависимости. И другие тулзы
          # так же»): the programs the Studio runs beside it, pinned in launcher/win_tools.py: FFmpeg 9.0.2's ffmpeg and ffprobe (Gyan.dev's static
          # GPL-3.0 release build) and FluidSynth 2.5.7 (LGPL-2.1), each held to its size and SHA-256 and unpacked into runtime\<name> with its
          # licence and SOURCE.txt (where its source is); lab/winx.runtime_path and RuachStudio.exe put them first on PATH
          python3 launcher/win_tools.py --into "$S" ffmpeg fluidsynth
          # HERESY 2880: RuachStudio.exe, the launcher (launcher/win, Go): the lab and the engine kept as two services, the page opened, their
          # output in logs\, a tester's report in one zip. Its tests first: both packages' decisions, and the real binary on a made-up
          # native Studio (install, two services, a killed engine started again, Ctrl-C, status, report, a failing engine given up, self-test)
          fv=$(printf '%s' "$ver" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1.0/')
          ( cd launcher/win
            go test ./...
            bash testdata/e2e-native.sh | tail -1
            # HERESY 2998: the icon, the version and the manifest from cmd/ruachstudio/winres (go-winres's gui one with activeCodePage UTF-8)
            go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64 --in cmd/ruachstudio/winres/winres.json --out cmd/ruachstudio/rsrc --file-version "$fv" --product-version "$fv"
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$ver" -o "$GITHUB_WORKSPACE/$S/RuachStudio.exe" ./cmd/ruachstudio )
          rm -rf "$S/launcher/win"
          ls -la "$S/RuachStudio.exe"
          cat > note.md <<'EOF'
          > [!NOTE]
          > **A beta package of Ruach Studio @VER@ for Windows 11 (x64), native, without WSL**, made by GitHub's builder from `@REF@` (commit @SHA@, @DATE@). Double-click **RuachStudio.exe**: the first start brings the Studio's own Python and the models a song needs into this folder, in a console window that shows each step (nothing is installed for the whole machine); every start runs the lab and the engine in the background, opens the Studio, and puts its icon beside the clock, whose menu holds the logs, a tester's report in one .zip, a restart, a stop and Quit. RuachStudio.cmd does the same with the lab and the engine in console windows of their own. With an NVIDIA card the engine runs on it (engine\cuda), without one on the processor (engine\cpu, slowly). Nothing here is signed: SmartScreen asks once (More info, then Run anyway).

          EOF
          { sed -e "s/@SHA@/$sha/" -e "s/@DATE@/$when/" -e "s|@REF@|$ref|" -e "s/@VER@/$ver/" note.md; awk 'skip && /^>/ {next} skip && /^$/ {skip=0; next} {skip=0; print}' skip=1 README.md; } > "$S/README.md"
          printf 'Ruach Studio %s, the native Windows package (beta)\ncommit   %s (%s)\nbuilt    %s by %s\nengines  %s\n         engine\\cuda: CUDA 12.8, compute 6.1 (Pascal) to 12.0 (Blackwell) · engine\\cpu: x64 with AVX2\n' \
            "$ver" "$(git rev-parse HEAD)" "$ref" "$when" "$run" "$src" > "$S/BUILD.txt"
          printf 'natives %s\n' "${nat:- none}" >> "$S/BUILD.txt"   # HERESY 2992: the natives job's legs in this package
          (cd stage && zip -q -r "../$file" RuachStudio)
          ls -la "$file"; unzip -l "$file" | tail -1; du -sh "$S" "$S/engine/cuda" "$S/engine/cpu"
          echo "file=$file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.file }}
          archive: false
          retention-days: 30

  check-windows:
    # HERESY 2685: the zip as a Windows person gets it: unpacked by Expand-Archive; engine\cpu starts from its folder; engine\cuda finds every
    # DLL it loads in its own folder or in Windows, all but nvcuda.dll, the NVIDIA driver's own (a runner has no driver, so this engine cannot
    # start here: its first run is on a card); start.py picks engine\cuda when a card answers and engine\cpu when none does; the lab from the
    # package starts and answers
    name: Package · windows-x64 · unpacked and tried
    needs: package-windows
    if: ${{ !cancelled() && needs.package-windows.result == 'success' }}
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package-windows.outputs.file }}
          path: pkg
          skip-decompress: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unpacked; engine\cpu starts; engine\cuda has every DLL but the driver's; start.py picks each
        shell: pwsh
        run: |
          $zip = Get-ChildItem pkg -Recurse -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "the package did not come down" }
          "{0}: {1:N0} MB" -f $zip.Name, ($zip.Length / 1MB)
          Expand-Archive $zip.FullName -DestinationPath unpacked
          $R = (Resolve-Path unpacked\RuachStudio).Path
          $out = & "$R\engine\cpu\yue-server.exe" --help 2>&1 | Out-String
          $code = $LASTEXITCODE
          "== engine\cpu\yue-server.exe --help: exit $code"
          ($out -split "`n" | Select-Object -First 3) -join "`n"
          if (($code -ne 0 -and $code -ne 1) -or -not $out.Trim()) { throw "engine\cpu\yue-server.exe did not start (exit $code)" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $dir = "$R\engine\cuda"
          $seen = @{}; $todo = [System.Collections.Queue]::new(); $todo.Enqueue("yue-server.exe"); $missing = @(); $own = @(); $driver = @()
          while ($todo.Count) {
            $n = $todo.Dequeue()
            if ($seen.ContainsKey($n.ToLower())) { continue }
            $seen[$n.ToLower()] = 1; $own += $n
            foreach ($d in (& $dumpbin /nologo /dependents (Join-Path $dir $n) | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^[\w.-]+\.dll$' })) {
              if (Test-Path (Join-Path $dir $d)) { $todo.Enqueue($d) }
              elseif ($d -ieq "nvcuda.dll") { $driver += $n }
              elseif ($d -notmatch '^(api|ext)-ms-' -and -not (Test-Path (Join-Path $env:SystemRoot "System32\$d"))) { $missing += "$n needs $d" }
            }
          }
          "== engine\cuda: yue-server.exe loads {0} files of its own ({1}); nvcuda.dll, the NVIDIA driver's, from {2}" -f $own.Count, ($own -join ", "), ($driver -join ", ")
          if ($missing) { throw "engine\cuda is missing: $($missing -join '; ')" }
          if ($own -notcontains "cudart64_12.dll" -or $own -notcontains "cublas64_12.dll") { throw "engine\cuda does not load CUDA's runtime from its folder" }
          $env:PYTHONUTF8 = "1"
          python -I -c "import sys; sys.path.insert(0, sys.argv[1]); import start; c, n = start.engine_bin(True), start.engine_bin(False); print('a card answers:', c); print('no card:       ', n); print('this runner:    nvidia-smi', start.smi(), '· a card answers:', start.card_answers(start.smi())); assert c.parent.name == 'cuda' and c.is_file() and n.parent.name == 'cpu' and n.is_file()" "$R\launcher"
          if ($LASTEXITCODE) { throw "start.py does not pick the package's engines" }
          Get-Content "$R\BUILD.txt"
      - name: The programs beside the Studio (HERESY 2989) start, have what the Studio asks of them, and take a path with a space and Cyrillic
        shell: pwsh
        run: |
          $R = (Resolve-Path unpacked\RuachStudio).Path
          $ff, $fp, $fs = "$R\runtime\ffmpeg\ffmpeg.exe", "$R\runtime\ffmpeg\ffprobe.exe", "$R\runtime\fluidsynth\fluidsynth.exe"
          foreach ($x in $ff, $fp, $fs, "$R\runtime\ffmpeg\LICENSE", "$R\runtime\ffmpeg\SOURCE.txt", "$R\runtime\fluidsynth\LGPL-2.1.txt") { if (-not (Test-Path $x)) { throw "the package has no $x" } }
          (& $ff -hide_banner -version | Select-Object -First 1)
          # what the lab passes to it (the tools audit of 25.11.2026): its filters and encoders, each by name
          $flt = & $ff -hide_banner -filters | Out-String; $enc = & $ff -hide_banner -encoders | Out-String
          foreach ($n in "rubberband", "loudnorm", "ebur128", "subtitles", "lut3d", "zoompan", "xfade", "afftdn", "deesser", "asendcmd", "aresample", "atempo", "adeclick", "acompressor") {
            if ($flt -notmatch "\s$n\s") { throw "ffmpeg has no $n filter" } }
          foreach ($n in "libx264", "libx265", "libopus", "libmp3lame", "flac", "aac", "pcm_s24le", "mjpeg") { if ($enc -notmatch "\s$n\s") { throw "ffmpeg has no $n encoder" } }
          # a folder with a space and Cyrillic, as a Windows person's songs lie (its letters from their code points: the runner writes this script in its own encoding)
          $cy = -join ([char[]](0x041F, 0x0440, 0x043E, 0x0431, 0x0430))
