          $f = Join-Path $d "$cy 1.flac"
          & $ff -v error -y -f lavfi -i "sine=f=440:d=1" -c:a flac $f
          if ($LASTEXITCODE -or -not (Test-Path -LiteralPath $f)) { throw "ffmpeg did not write $f" }
          $s = (& $fp -v error -show_entries format=duration -of csv=p=0 $f | Out-String).Trim()
          "ffprobe: $s s in $f"
          if ([double]::Parse($s, [Globalization.CultureInfo]::InvariantCulture) -lt 0.9) { throw "ffprobe read $s s from $f" }
          $v = & $fs --version 2>&1 | Out-String
          if ($v -notmatch "2\.5\.7") { throw "fluidsynth.exe did not start (exit $LASTEXITCODE): $v" }
