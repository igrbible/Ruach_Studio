          # the lab's own way: winx.runtime_path puts runtime\<name> first on PATH, and shutil.which then finds the package's ffmpeg
          $env:PYTHONUTF8 = "1"
          python -I -c "import os, shutil, sys; sys.path.insert(0, os.path.join(sys.argv[1], 'lab')); import winx; print('first on PATH:', winx.runtime_path(sys.argv[1])); w = shutil.which('ffmpeg'); print('ffmpeg:', w); assert w and os.path.dirname(w).lower() == os.path.join(sys.argv[1], 'runtime', 'ffmpeg').lower()" $R
          if ($LASTEXITCODE) { throw "the lab does not find the package's ffmpeg first on PATH" }
      - name: The natives beside the engine (HERESY 2992) carry UTF-8, find their DLLs, the processor's start, and the lab finds them
        shell: pwsh
        run: |
          $R = (Resolve-Path unpacked\RuachStudio).Path
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = (Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1).FullName
          $mt = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $now = Join-Path $env:RUNNER_TEMP "now.manifest"; $bad = @(); $absent = @()
          foreach ($k in "cpu", "cuda") {
            foreach ($n in "llama-server", "llama-mtmd-cli", "audiocpp_server", "ruach-muscriptor") {
              if ($k -eq "cuda" -and $n -eq "ruach-muscriptor") { continue }   # the processor's alone, as on Linux
              $x = "$R\engine\$k\$n.exe"
